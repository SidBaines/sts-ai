[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slay-the-spire-env"
version = "0.1.0"
description = "A reproducible Slay the Spire environment for custom agents and reinforcement learning."
readme = "README.md"
license-files = ["THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gym = ["gymnasium==1.4.0"]

[project.scripts]
sts-env = "sts_env.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sts_env*"]

[tool.setuptools.package-data]
"sts_env._backend" = ["native_manifest.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
