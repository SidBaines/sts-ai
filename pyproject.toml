[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slay-the-spire-env"
version = "0.1.5"
description = "A reproducible Slay the Spire environment for custom agents and reinforcement learning."
readme = "README.md"
license-files = ["THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gym = ["gymnasium==1.4.0"]
llm = ["torch==2.13.0", "transformers==5.19.0", "peft==0.21.2", "accelerate==1.15.0", "aiohttp>=3.12,<4"]
serve = ["vllm==0.32.0"]

[project.scripts]
sts-env = "sts_env.cli:main"
sts-llm-train = "sts_llm.training:main"
sts-llm-dataset = "sts_llm.dataset:main"
sts-llm-evaluate = "sts_llm.eval:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sts_env*", "sts_llm*"]

[tool.setuptools.package-data]
"sts_env._backend" = ["native_manifest.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
