[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slay-the-spire-env"
version = "0.1.5"
description = "A reproducible Slay the Spire environment for custom agents and reinforcement learning."
readme = "README.md"
license-files = ["THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gym = ["gymnasium==1.4.0"]
policy = ["torch==2.14.0", "numpy==2.5.4"]
policy-mlx = ["mlx==0.30.6", "numpy==2.5.4"]

[project.scripts]
sts-env = "sts_env.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sts_env*", "sts_policy*"]

[tool.setuptools.package-data]
sts_policy = ["entity_vocabulary.json"]
"sts_env._backend" = ["native_manifest.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
